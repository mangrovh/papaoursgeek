<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jeu des Paires 🔤</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap');

:root {
  --bg: #F8F0FF;
  --primary: #7C3AED;
  --gold: #F59E0B;
  --green: #10B981;
  --red: #EF4444;
  --shadow: 0 4px 16px rgba(0,0,0,0.09);
  --c1:#EF4444; --c1l:#FEE2E2;
  --c2:#3B82F6; --c2l:#DBEAFE;
  --c3:#10B981; --c3l:#D1FAE5;
  --c4:#F59E0B; --c4l:#FEF3C7;
  --c5:#8B5CF6; --c5l:#EDE9FE;
  --c6:#EC4899; --c6l:#FCE7F3;
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body {
  font-family:'Nunito',sans-serif; background:var(--bg);
  min-height:100vh; display:flex; flex-direction:column; align-items:center; overflow-x:hidden;
}
body::before {
  content:''; position:fixed; top:-100px; right:-100px; width:300px; height:300px;
  background:radial-gradient(circle,rgba(124,58,237,.10),transparent 70%);
  border-radius:50%; pointer-events:none;
}
body::after {
  content:''; position:fixed; bottom:-80px; left:-80px; width:260px; height:260px;
  background:radial-gradient(circle,rgba(245,158,11,.10),transparent 70%);
  border-radius:50%; pointer-events:none;
}

/* Confetti */
.cf-wrap{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden;}
.cp{position:absolute;top:-16px;animation:cpFall linear forwards;}
@keyframes cpFall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(110vh) rotate(720deg)}}

/* Header */
header{width:100%;max-width:500px;padding:14px 18px 6px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);z-index:10;}
.logo{font-weight:900;font-size:20px;color:var(--primary);}
.hud{display:flex;gap:8px;}
.pill{background:white;border-radius:30px;padding:5px 12px;font-weight:900;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.08);display:flex;align-items:center;gap:4px;}
.pill.ok{color:var(--green);} .pill.num{color:var(--primary);}

/* Progress */
.prog-wrap{width:100%;max-width:500px;padding:0 18px 10px;}
.prog-track{height:8px;background:#DDD6FE;border-radius:8px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--gold));border-radius:8px;transition:width .5s ease;}
.prog-lbl{text-align:right;font-size:11px;color:#A78BFA;font-weight:800;margin-top:3px;}

/* Settings */
.settings-bar{width:100%;max-width:500px;padding:0 18px 10px;display:flex;gap:8px;}
.toggle-btn{flex:1;padding:8px;border:2.5px solid #DDD6FE;background:white;border-radius:12px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;transition:all .2s;color:#9CA3AF;}
.toggle-btn.active{border-color:var(--primary);background:#EDE9FE;color:var(--primary);}
.toggle-btn:active{transform:scale(.96);}

/* Main */
main{width:100%;max-width:500px;padding:0 14px 30px;display:flex;flex-direction:column;gap:10px;}

/* Round badge */
.round-badge{text-align:center;font-weight:900;font-size:13px;color:#A78BFA;}

/* Syllable hint pills */
.syl-row{display:flex;justify-content:center;gap:8px;}
.syl-pill{font-weight:900;font-size:12px;padding:3px 10px;border-radius:20px;letter-spacing:.5px;}
.sp1{background:#FEE2E2;color:#B91C1C;}
.sp2{background:#DBEAFE;color:#1D4ED8;}
.sp3{background:#D1FAE5;color:#065F46;}

/* Board */
.board{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start;}
.col-words,.col-images{display:flex;flex-direction:column;gap:8px;}

/* Word card */
.word-card{
  background:white;border:2.5px solid #E5E7EB;border-radius:14px;padding:0 8px;
  text-align:center;font-family:'Nunito',sans-serif;font-weight:900;
  font-size:clamp(13px,3.8vw,17px);color:#374151;
  cursor:pointer;transition:all .15s;box-shadow:var(--shadow);
  user-select:none;touch-action:manipulation;
  height:50px;display:flex;align-items:center;justify-content:center;line-height:1.1;
}
.word-card:active:not(.locked){transform:scale(.94);}

/* Image card */
.img-card{
  background:white;border:2.5px solid #E5E7EB;border-radius:14px;
  height:50px;display:flex;align-items:center;justify-content:center;
  font-size:clamp(24px,7vw,30px);cursor:pointer;transition:all .15s;
  box-shadow:var(--shadow);user-select:none;touch-action:manipulation;
}
.img-card:active:not(.locked){transform:scale(.94);}

/* Selected */
.word-card.selected,.img-card.selected{
  border-color:var(--gold);background:#FEF3C7;transform:scale(1.04);
  box-shadow:0 0 0 3px rgba(245,158,11,.25),var(--shadow);
}

/* Matched */
.word-card.m1,.img-card.m1{background:var(--c1l);border-color:var(--c1);color:var(--c1);}
.word-card.m2,.img-card.m2{background:var(--c2l);border-color:var(--c2);color:var(--c2);}
.word-card.m3,.img-card.m3{background:var(--c3l);border-color:var(--c3);color:var(--c3);}
.word-card.m4,.img-card.m4{background:var(--c4l);border-color:var(--c4);color:var(--c4);}
.word-card.m5,.img-card.m5{background:var(--c5l);border-color:var(--c5);color:var(--c5);}
.word-card.m6,.img-card.m6{background:var(--c6l);border-color:var(--c6);color:var(--c6);}
.word-card.locked,.img-card.locked{cursor:default;}

/* Wrong */
.word-card.wrong,.img-card.wrong{animation:wrongShake .35s ease;background:#FEE2E2;border-color:var(--red);}
@keyframes wrongShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* Pop */
@keyframes matchPop{0%{transform:scale(1)}40%{transform:scale(1.07)}70%{transform:scale(.97)}100%{transform:scale(1)}}
.word-card.pop,.img-card.pop{animation:matchPop .38s ease;}

/* Uppercase */
.uppercase-mode .word-card{text-transform:uppercase;letter-spacing:1px;font-size:clamp(11px,3.2vw,14px);}

/* Round overlay */
.round-overlay{display:none;position:fixed;inset:0;z-index:50;background:rgba(248,240,255,.93);align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;animation:fadeIn .3s ease;}
.round-overlay.show{display:flex;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.ov-emoji{font-size:68px;animation:bigBounce .5s ease;}
@keyframes bigBounce{0%{transform:scale(0)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.ov-msg{font-weight:900;font-size:30px;color:var(--primary);}
.ov-sub{font-size:14px;font-weight:800;color:#6B7280;}

/* End */
.end-screen{display:none;flex-direction:column;align-items:center;text-align:center;gap:18px;padding:30px 20px;width:100%;max-width:500px;}
.end-screen.on{display:flex;}
.end-trophy{font-size:76px;animation:trophyBounce 1s ease infinite alternate;}
@keyframes trophyBounce{from{transform:translateY(0) rotate(-5deg)}to{transform:translateY(-10px) rotate(5deg)}}
.end-title{font-weight:900;font-size:34px;color:var(--primary);}
.end-score{font-weight:900;font-size:50px;color:var(--gold);}
.end-sub{font-size:15px;color:#6B7280;font-weight:700;}
.end-stars{font-size:38px;letter-spacing:8px;}
.restart-btn{background:linear-gradient(135deg,var(--primary),var(--gold));color:white;border:none;border-radius:20px;padding:16px 38px;font-family:'Nunito',sans-serif;font-weight:900;font-size:19px;cursor:pointer;box-shadow:0 6px 18px rgba(124,58,237,.30);transition:all .2s;}
.restart-btn:active{transform:scale(.95);}
</style>
</head>
<body>

<div class="cf-wrap" id="cfWrap"></div>

<div class="round-overlay" id="roundOverlay">
  <div class="ov-emoji" id="ovEmoji">🌟</div>
  <div class="ov-msg"   id="ovMsg">Parfait !</div>
  <div class="ov-sub"   id="ovSub"></div>
</div>

<header>
  <div class="logo">🔤 Lis bien le mot !</div>
  <div class="hud">
    <div class="pill ok">✅ <span id="scoreEl">0</span></div>
    <div class="pill num">🎯 <span id="roundEl">1</span>/20</div>
  </div>
</header>

<div class="prog-wrap">
  <div class="prog-track"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
  <div class="prog-lbl" id="progLbl">0 / 20</div>
</div>

<div class="settings-bar">
  <button class="toggle-btn active" id="btnScript" onclick="setFont('script')">✏️ Script</button>
  <button class="toggle-btn"        id="btnMaj"    onclick="setFont('uppercase')">🔠 Majuscules</button>
</div>

<main id="gameArea">
  <div class="round-badge" id="roundBadge">Manche 1 sur 20</div>
  <div class="syl-row" id="sylRow"></div>
  <div class="board">
    <div class="col-words"  id="colWords"></div>
    <div class="col-images" id="colImages"></div>
  </div>
</main>

<div class="end-screen" id="endScreen">
  <div class="end-trophy">🏆</div>
  <div class="end-title">Bravo !</div>
  <div class="end-stars" id="endStars">⭐⭐⭐</div>
  <div class="end-score"><span id="finalScore">0</span> / 20</div>
  <div class="end-sub"   id="endSub"></div>
  <button class="restart-btn" onclick="startGame()">🔄 Rejouer !</button>
</div>

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let ROUNDS=[], roundIdx=0, score=0, fontMode='script';
let selWord=null, selImg=null, matched=0, roundPairs=[], busy=false;
const TOTAL=50;

// ─────────────────────────────────────────────
// UTILS
// ─────────────────────────────────────────────
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function confetti(n){
  const w=document.getElementById('cfWrap');
  const cols=['#7C3AED','#F59E0B','#EF4444','#3B82F6','#10B981','#EC4899'];
  for(let i=0;i<n;i++){
    const el=document.createElement('div'); el.className='cp';
    const sz=7+Math.random()*9;
    el.style.cssText=`left:${Math.random()*100}%;width:${sz}px;height:${sz}px;
      background:${cols[Math.random()*cols.length|0]};
      border-radius:${Math.random()>.5?'50%':'3px'};
      animation-duration:${1.3+Math.random()*1.7}s;
      animation-delay:${Math.random()*0.3}s;`;
    w.appendChild(el);
    el.addEventListener('animationend',()=>el.remove());
  }
}

// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────
function startGame(){
  ROUNDS = shuffle([...ALL_ROUNDS]);
  roundIdx=0; score=0;
  document.getElementById('scoreEl').textContent=0;
  document.getElementById('roundEl').textContent=1;
  document.getElementById('progFill').style.width='0%';
  document.getElementById('progLbl').textContent='0 / '+TOTAL;
  document.getElementById('gameArea').style.display='flex';
  document.getElementById('endScreen').classList.remove('on');
  renderRound();
}

function renderRound(){
  selWord=null; selImg=null; matched=0; busy=false;
  roundPairs=ROUNDS[roundIdx].map((p,i)=>({...p,id:i+1}));

  document.getElementById('roundBadge').textContent='Manche '+(roundIdx+1)+' sur '+TOTAL;
  document.getElementById('roundEl').textContent=roundIdx+1;

  const isUp=fontMode==='uppercase';

  const sylsSeen=[], sylsUniq=[];
  roundPairs.forEach(p=>{ if(!sylsSeen.includes(p.s)){sylsSeen.push(p.s);sylsUniq.push(p.s);} });
  const sylRow=document.getElementById('sylRow');
  sylRow.innerHTML='';
  sylsUniq.forEach((s,i)=>{
    const pill=document.createElement('span');
    pill.className='syl-pill sp'+(i+1);
    pill.textContent=(isUp?s.toUpperCase():s)+'…';
    sylRow.appendChild(pill);
  });

  const wordOrder =shuffle([...roundPairs]);
  const imageOrder=shuffle([...roundPairs]);

  const colW=document.getElementById('colWords');
  const colI=document.getElementById('colImages');
  colW.innerHTML=''; colI.innerHTML='';

  wordOrder.forEach(pair=>{
    const el=document.createElement('div');
    el.className='word-card'+(isUp?' uppercase-mode':'');
    el.textContent=isUp?pair.w.toUpperCase():pair.w;
    el.dataset.id=pair.id;
    el.dataset.w=pair.w;
    el.onclick=()=>onWord(el);
    colW.appendChild(el);
  });

  imageOrder.forEach(pair=>{
    const el=document.createElement('div');
    el.className='img-card';
    el.textContent=pair.e;
    el.dataset.id=pair.id;
    el.onclick=()=>onImg(el);
    colI.appendChild(el);
  });
}

// ─────────────────────────────────────────────
// SELECTION
// ─────────────────────────────────────────────
function onWord(el){
  if(busy||el.classList.contains('locked')) return;
  if(selWord){
    if(selWord.el===el){selWord.el.classList.remove('selected');selWord=null;return;}
    selWord.el.classList.remove('selected');
  }
  selWord={el,id:+el.dataset.id};
  el.classList.add('selected');
  tryMatch();
}

function onImg(el){
  if(busy||el.classList.contains('locked')) return;
  if(selImg){
    if(selImg.el===el){selImg.el.classList.remove('selected');selImg=null;return;}
    selImg.el.classList.remove('selected');
  }
  selImg={el,id:+el.dataset.id};
  el.classList.add('selected');
  tryMatch();
}

function tryMatch(){
  if(!selWord||!selImg) return;
  busy=true;
  const w=selWord,i=selImg;
  selWord=null; selImg=null;

  if(w.id===i.id){
    const cls='m'+w.id;
    w.el.classList.remove('selected'); i.el.classList.remove('selected');
    w.el.classList.add(cls,'locked','pop');
    i.el.classList.add(cls,'locked','pop');
    confetti(5);
    matched++;
    if(matched===6) setTimeout(()=>roundComplete(),480);
    else busy=false;
  } else {
    w.el.classList.remove('selected'); i.el.classList.remove('selected');
    w.el.classList.add('wrong'); i.el.classList.add('wrong');
    setTimeout(()=>{w.el.classList.remove('wrong');i.el.classList.remove('wrong');busy=false;},420);
  }
}

// ─────────────────────────────────────────────
// ROUND END
// ─────────────────────────────────────────────
function roundComplete(){
  score++;
  document.getElementById('scoreEl').textContent=score;
  confetti(18);

  const isLast=roundIdx>=TOTAL-1;
  document.getElementById('ovEmoji').textContent=isLast?'🏆':'🌟';
  document.getElementById('ovMsg').textContent  =isLast?'Terminé !':'Parfait !';
  document.getElementById('ovSub').textContent  =isLast
    ?'Score final : '+score+' / '+TOTAL
    :'Manche '+(roundIdx+1)+' réussie !';

  const ov=document.getElementById('roundOverlay');
  ov.classList.add('show');
  setTimeout(()=>{
    ov.classList.remove('show');
    roundIdx++;
    if(roundIdx>=TOTAL) endGame();
    else{
      document.getElementById('progFill').style.width=(roundIdx/TOTAL*100)+'%';
      document.getElementById('progLbl').textContent=roundIdx+' / '+TOTAL;
      renderRound();
    }
  }, isLast?2200:1300);
}

function endGame(){
  document.getElementById('gameArea').style.display='none';
  document.getElementById('progFill').style.width='100%';
  document.getElementById('progLbl').textContent=TOTAL+' / '+TOTAL;
  document.getElementById('endScreen').classList.add('on');
  document.getElementById('finalScore').textContent=score;
  const pct=score/TOTAL;
  let stars,sub;
  if(pct>=.9){stars='⭐⭐⭐';sub='Champion(ne) des syllabes ! Incroyable ! 🎉';}
  else if(pct>=.7){stars='⭐⭐';sub='Super travail, tu es fort(e) ! 💪';}
  else{stars='⭐';sub="Bien essayé ! Recommence pour t'améliorer !";}
  document.getElementById('endStars').textContent=stars;
  document.getElementById('endSub').textContent=sub;
  confetti(40);
}

// ─────────────────────────────────────────────
// FONT
// ─────────────────────────────────────────────
function setFont(mode){
  fontMode=mode;
  document.getElementById('btnScript').classList.toggle('active',mode==='script');
  document.getElementById('btnMaj').classList.toggle('active',   mode==='uppercase');
  const isUp=mode==='uppercase';
  const sylsSeen=[],sylsUniq=[];
  roundPairs.forEach(p=>{if(!sylsSeen.includes(p.s)){sylsSeen.push(p.s);sylsUniq.push(p.s);}});
  document.querySelectorAll('.syl-pill').forEach((pill,i)=>{
    if(sylsUniq[i]) pill.textContent=(isUp?sylsUniq[i].toUpperCase():sylsUniq[i])+'…';
  });
  document.querySelectorAll('.word-card').forEach(el=>{
    const w=el.dataset.w;
    if(w) el.textContent=isUp?w.toUpperCase():w;
    el.classList.toggle('uppercase-mode',isUp);
  });
}

startGame();
</script>
