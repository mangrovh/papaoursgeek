<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jeu des Devinettes 🔍</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800;900&family=Nunito:wght@700;800;900&display=swap');

:root {
  --bg: #0F172A;
  --surface: #1E293B;
  --surface2: #263348;
  --border: #334155;
  --accent1: #38BDF8;
  --accent2: #FB923C;
  --accent3: #A78BFA;
  --gold: #FBBF24;
  --green: #4ADE80;
  --red: #F87171;
  --text: #F1F5F9;
  --muted: #94A3B8;
  --glow1: rgba(56,189,248,0.3);
  --glow2: rgba(251,146,60,0.3);
  --glow3: rgba(167,139,250,0.3);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Baloo 2', cursive;
  overflow-x: hidden;
}

/* ── Background stars ── */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.6) 0%, transparent 100%),
    radial-gradient(1px 1px at 75% 15%, rgba(255,255,255,0.5) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 50% 60%, rgba(255,255,255,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 85% 80%, rgba(255,255,255,0.5) 0%, transparent 100%),
    radial-gradient(1px 1px at 10% 75%, rgba(255,255,255,0.4) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 40% 90%, rgba(255,255,255,0.3) 0%, transparent 100%),
    radial-gradient(1px 1px at 65% 45%, rgba(255,255,255,0.5) 0%, transparent 100%),
    radial-gradient(2px 2px at 30% 55%, rgba(255,255,255,0.2) 0%, transparent 100%);
  pointer-events: none;
  z-index: 0;
}

/* ── Confetti ── */
.confetti-container {
  position: fixed; inset: 0;
  pointer-events: none; z-index: 999; overflow: hidden;
}
.confetti-piece {
  position: absolute; top: -20px;
  animation: cfFall linear forwards;
}
@keyframes cfFall {
  0%   { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
  80%  { opacity: 1; }
  100% { transform: translateY(110vh) rotate(720deg) scale(0.5); opacity: 0; }
}

/* ── Layout ── */
.app {
  position: relative; z-index: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-bottom: 40px;
}

/* ── Header ── */
header {
  width: 100%; max-width: 500px;
  padding: 18px 20px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-family: 'Baloo 2', cursive;
  font-weight: 900;
  font-size: 22px;
  background: linear-gradient(135deg, var(--accent1), var(--accent3));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.hud {
  display: flex; gap: 8px;
}

.hud-pill {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 13px;
  font-weight: 800;
  display: flex; align-items: center; gap: 4px;
}
.hud-pill.ok  { color: var(--green); border-color: rgba(74,222,128,0.3); }
.hud-pill.num { color: var(--accent3); border-color: rgba(167,139,250,0.3); }

/* ── Progress ── */
.prog-wrap {
  width: 100%; max-width: 500px;
  padding: 0 20px 16px;
}
.prog-track {
  height: 8px;
  background: var(--surface2);
  border-radius: 8px;
  overflow: hidden;
}
.prog-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent1), var(--accent3));
  border-radius: 8px;
  transition: width 0.5s cubic-bezier(.4,0,.2,1);
  box-shadow: 0 0 10px var(--glow1);
}
.prog-lbl {
  text-align: right;
  font-size: 11px;
  color: var(--muted);
  font-weight: 700;
  margin-top: 4px;
}

/* ── Question ── */
main {
  width: 100%; max-width: 500px;
  padding: 0 16px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.question-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 24px;
  padding: 22px 22px 18px;
  position: relative;
  overflow: hidden;
}

.question-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--accent1), var(--accent2), var(--accent3));
}

.q-label {
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 3px;
  color: var(--accent1);
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 6px;
}

.q-label::before { content: '🔍'; font-size: 14px; }

.question-text {
  font-family: 'Nunito', sans-serif;
  font-size: clamp(19px, 5.2vw, 24px);
  font-weight: 800;
  line-height: 1.5;
  color: var(--text);
  letter-spacing: 0.2px;
}

/* ── Font modes ── */
body.mode-uppercase .question-text {
  text-transform: uppercase;
  font-size: clamp(15px, 4.2vw, 20px);
  letter-spacing: 1.5px;
  font-weight: 900;
}
body.mode-uppercase .emoji-label {
  text-transform: uppercase;
  letter-spacing: 1.5px;
  font-size: 10px;
}

/* ── Settings bar ── */
.settings-bar {
  width: 100%; max-width: 500px;
  padding: 0 20px 14px;
  display: flex;
  gap: 10px;
}

.toggle-btn {
  flex: 1;
  padding: 9px;
  border: 2px solid var(--border);
  background: var(--surface);
  border-radius: 14px;
  font-family: 'Nunito', sans-serif;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.2s;
  color: var(--muted);
}
.toggle-btn.active {
  border-color: var(--accent1);
  background: rgba(56,189,248,0.12);
  color: var(--accent1);
}
.toggle-btn:active { transform: scale(0.96); }

/* ── Images grid ── */
.images-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.img-btn {
  background: var(--surface);
  border: 2.5px solid var(--border);
  border-radius: 20px;
  aspect-ratio: 1 / 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
  transition: all 0.18s cubic-bezier(.4,0,.2,1);
  overflow: hidden;
  position: relative;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.img-btn:active:not(:disabled) { transform: scale(0.93); }
.img-btn:disabled { cursor: default; }

/* hover on desktop */
@media (hover: hover) {
  .img-btn:hover:not(:disabled) {
    border-color: var(--accent1);
    transform: translateY(-3px);
    box-shadow: 0 8px 24px var(--glow1);
  }
}

.img-btn .emoji {
  font-size: clamp(38px, 12vw, 56px);
  line-height: 1;
  user-select: none;
  transition: transform 0.2s;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
}

.img-btn .emoji-label {
  font-family: 'Nunito', sans-serif;
  font-size: 12px;
  font-weight: 800;
  color: var(--muted);
  letter-spacing: 0.3px;
  transition: color 0.2s;
  text-align: center;
  padding: 0 4px;
}

/* Feedback states */
.img-btn.correct {
  border-color: var(--green);
  background: rgba(74,222,128,0.12);
  box-shadow: 0 0 24px rgba(74,222,128,0.4);
  animation: correctPop 0.45s ease;
}
.img-btn.correct .emoji-label { color: var(--green); }

.img-btn.wrong {
  border-color: var(--red);
  background: rgba(248,113,113,0.1);
  animation: wrongShake 0.35s ease;
}
.img-btn.wrong .emoji-label { color: var(--red); }

.img-btn.reveal {
  border-color: var(--green);
  background: rgba(74,222,128,0.1);
  box-shadow: 0 0 16px rgba(74,222,128,0.25);
}
.img-btn.reveal .emoji-label { color: var(--green); }

@keyframes correctPop {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.08); }
  70%  { transform: scale(0.96); }
  100% { transform: scale(1); }
}
@keyframes wrongShake {
  0%, 100% { transform: rotate(0deg); }
  20%       { transform: rotate(-4deg); }
  40%       { transform: rotate(4deg); }
  60%       { transform: rotate(-3deg); }
  80%       { transform: rotate(3deg); }
}

/* Badge overlay on image card */
.img-btn .badge {
  position: absolute; top: 8px; right: 8px;
  font-size: 20px;
  opacity: 0;
  transform: scale(0);
  transition: all 0.2s;
}
.img-btn.correct .badge, .img-btn.reveal .badge { opacity: 1; transform: scale(1); }
.img-btn.correct .badge::before { content: '⭐'; }
.img-btn.reveal  .badge::before { content: '✅'; }
.img-btn.wrong   .badge { opacity: 1; transform: scale(1); }
.img-btn.wrong   .badge::before { content: '❌'; }

/* ── End screen ── */
.end-screen {
  display: none;
  width: 100%; max-width: 500px;
  padding: 30px 24px;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  text-align: center;
}
.end-screen.on { display: flex; }

.end-planet { font-size: 72px; animation: planetFloat 2s ease-in-out infinite alternate; }
@keyframes planetFloat {
  from { transform: translateY(0) rotate(-5deg); }
  to   { transform: translateY(-14px) rotate(5deg); }
}

.end-title {
  font-weight: 900;
  font-size: 38px;
  background: linear-gradient(135deg, var(--gold), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.end-stars { font-size: 44px; letter-spacing: 10px; }

.end-score {
  font-size: 58px;
  font-weight: 900;
  color: var(--accent1);
  text-shadow: 0 0 30px var(--glow1);
}

.end-msg {
  color: var(--muted);
  font-size: 16px;
  font-weight: 700;
  line-height: 1.5;
}

.end-bar {
  width: 100%;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 16px;
  padding: 14px 20px;
  display: flex;
  justify-content: space-around;
}
.end-stat { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.end-stat-val { font-size: 28px; font-weight: 900; }
.end-stat-lbl { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

.replay-btn {
  background: linear-gradient(135deg, var(--accent1), var(--accent3));
  color: #0F172A;
  border: none;
  border-radius: 20px;
  padding: 16px 42px;
  font-family: 'Baloo 2', cursive;
  font-size: 20px;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 6px 24px var(--glow1);
  transition: all 0.2s;
  letter-spacing: 0.5px;
}
.replay-btn:active { transform: scale(0.95); }

/* ── Transition animation ── */
@keyframes slideIn {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
.slide-in { animation: slideIn 0.35s ease forwards; }
</style>
</head>
<body>

<div class="confetti-container" id="cf"></div>

<div class="app">
  <!-- Header -->
  <header>
    <div class="logo">🔍 Devine l'image !</div>
    <div class="hud">
      <div class="hud-pill ok">⭐ <span id="scoreEl">0</span></div>
      <div class="hud-pill num"><span id="qEl">1</span>/100</div>
    </div>
  </header>

  <!-- Progress -->
  <div class="prog-wrap">
    <div class="prog-track"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
    <div class="prog-lbl" id="progLbl">0 / 100</div>
  </div>

  <!-- Settings -->
  <div class="settings-bar">
    <button class="toggle-btn active" id="btnScript" onclick="setFont('script')">✏️ Script</button>
    <button class="toggle-btn" id="btnMaj" onclick="setFont('uppercase')">🔠 Majuscules</button>
  </div>

  <!-- Game -->
  <main id="gameArea">
    <div class="question-card slide-in" id="qCard">
      <div class="q-label">Trouve l'image</div>
      <div class="question-text" id="qText"></div>
    </div>
    <div class="images-grid slide-in" id="imgGrid"></div>
  </main>

  <!-- End -->
  <div class="end-screen" id="endScreen">

    <div class="end-title">Terminé !</div>
    <div class="end-stars" id="endStars">⭐⭐⭐</div>
    <div class="end-score"><span id="finalScore">0</span><span style="font-size:24px;color:var(--muted)">/100</span></div>
    <div class="end-bar">
      <div class="end-stat">
        <div class="end-stat-val" id="statOk" style="color:var(--green)">0</div>
        <div class="end-stat-lbl">✅ Bonne</div>
      </div>
      <div class="end-stat">
        <div class="end-stat-val" id="statWrong" style="color:var(--red)">0</div>
        <div class="end-stat-lbl">❌ Erreur</div>
      </div>
      <div class="end-stat">
        <div class="end-stat-val" id="statPct" style="color:var(--gold)">0%</div>
        <div class="end-stat-lbl">🎯 Score</div>
      </div>
    </div>
    <div class="end-msg" id="endMsg"></div>
    <button class="replay-btn" onclick="startGame()">🚀 Rejouer !</button>
  </div>
</div>

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let questions = [];
let idx = 0;
let score = 0;
let wrong = 0;
let locked = false;
let fontMode = 'script';

function setFont(mode) {
  fontMode = mode;
  document.body.classList.toggle('mode-uppercase', mode === 'uppercase');
  document.getElementById('btnScript').classList.toggle('active', mode === 'script');
  document.getElementById('btnMaj').classList.toggle('active', mode === 'uppercase');
}

function shuffle(a) {
  const b = [...a];
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}

// ─────────────────────────────────────────────
// GAME LOGIC
// ─────────────────────────────────────────────
function startGame() {
  questions = shuffle(ALL).slice(0, 100);
  idx = 0; score = 0; wrong = 0; locked = false;
  document.getElementById('scoreEl').textContent = 0;
  document.getElementById('qEl').textContent = 1;
  document.getElementById('progFill').style.width = '0%';
  document.getElementById('progLbl').textContent = '0 / 100';
  document.getElementById('gameArea').style.display = 'flex';
  document.getElementById('endScreen').classList.remove('on');
  renderQ();
}

function renderQ() {
  locked = false;
  const q = questions[idx];

  // Question text
  const qt = document.getElementById('qText');
  qt.textContent = q.q;

  // Shuffle choices
  const choices = shuffle([q.answer, ...q.d]);

  const grid = document.getElementById('imgGrid');
  grid.innerHTML = '';
  grid.className = 'images-grid slide-in';

  choices.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'img-btn';
    btn.innerHTML = `
      <div class="emoji">${item.e}</div>
      <div class="emoji-label">${item.l}</div>
      <div class="badge"></div>
    `;
    btn.onclick = () => pick(btn, item, q.answer);
    grid.appendChild(btn);
  });

  // Trigger re-animation on question card
  const card = document.getElementById('qCard');
  card.classList.remove('slide-in');
  void card.offsetWidth;
  card.classList.add('slide-in');

  document.getElementById('qEl').textContent = idx + 1;
  document.getElementById('progFill').style.width = (idx / 100 * 100) + '%';
  document.getElementById('progLbl').textContent = idx + ' / 100';
}

function pick(btn, chosen, correct) {
  if (locked) return;
  locked = true;

  const allBtns = document.querySelectorAll('.img-btn');
  allBtns.forEach(b => b.disabled = true);

  const isOk = chosen.e === correct.e;

  if (isOk) {
    score++;
    document.getElementById('scoreEl').textContent = score;
    btn.classList.add('correct');
    confetti(12);
  } else {
    wrong++;
    btn.classList.add('wrong');
    allBtns.forEach(b => {
      const lbl = b.querySelector('.emoji-label').textContent;
      if (lbl === correct.l) b.classList.add('reveal');
    });
  }

  const delay = isOk ? 950 : 1300;
  setTimeout(() => {
    idx++;
    if (idx >= 100) endGame();
    else renderQ();
  }, delay);
}

function endGame() {
  document.getElementById('gameArea').style.display = 'none';
  document.getElementById('progFill').style.width = '100%';
  document.getElementById('progLbl').textContent = '100 / 100';

  const end = document.getElementById('endScreen');
  end.classList.add('on');
  document.getElementById('finalScore').textContent = score;
  document.getElementById('statOk').textContent = score;
  document.getElementById('statWrong').textContent = wrong;
  document.getElementById('statPct').textContent = score + '%';

  let stars, msg;
  if (score >= 90) {
    stars = '⭐⭐⭐';
    msg = 'Incroyable ! Tu es un(e) vrai(e) génie des devinettes ! 🚀';
  } else if (score >= 70) {
    stars = '⭐⭐';
    msg = 'Très bien ! Tu connais plein de choses ! 💪';
  } else {
    stars = '⭐';
    msg = 'Bien essayé ! Recommence pour t\'améliorer !';
  }

  document.getElementById('endStars').textContent = stars;
  document.getElementById('endMsg').textContent = msg;
  confetti(40);
}

// ─────────────────────────────────────────────
// CONFETTI
// ─────────────────────────────────────────────
function confetti(n) {
  const c = document.getElementById('cf');
  const cols = ['#38BDF8','#FBBF24','#FB923C','#A78BFA','#4ADE80','#F87171','#E879F9'];
  for (let i = 0; i < n; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    const size = 8 + Math.random() * 10;
    el.style.cssText = `
      left:${Math.random()*100}%;
      width:${size}px; height:${size}px;
      background:${cols[Math.random()*cols.length|0]};
      border-radius:${Math.random()>.5?'50%':'3px'};
      animation-duration:${1.4+Math.random()*1.8}s;
      animation-delay:${Math.random()*0.4}s;
    `;
    c.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }
}
